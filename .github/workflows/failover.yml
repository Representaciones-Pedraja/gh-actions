name: Failover Check

on:
  schedule:
    - cron: "*/40 * * * *"   # cada 40 minutos
  workflow_dispatch:

jobs:
  failover:
    runs-on: ubuntu-latest
    steps:
      - name: Chequear servidor 1
        id: health
        run: |
          STATUS="down"
          if curl -s --max-time 5 http://217.76.49.159 > /dev/null; then
            STATUS="up"
          fi
          echo "status=$STATUS" >> $GITHUB_OUTPUT

      - name: Actualizar DNS para pedraja.es
        run: |
          DOMAIN="pedraja.es"
          STATUS="${{ steps.health.outputs.status }}"

          RECORD_ID=$(curl -s -X GET "https://api.cloudflare.com/client/v4/zones/${{ secrets.CF_ZONE_ID }}/dns_records?type=A&name=$DOMAIN" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" | jq -r '.result[0].id')

          if [ "$STATUS" = "down" ]; then
            TARGET_IP="161.97.79.190"
          else
            TARGET_IP="217.76.49.159"
          fi

          echo "Actualizando $DOMAIN a $TARGET_IP"

          curl -s -X PUT "https://api.cloudflare.com/client/v4/zones/${{ secrets.CF_ZONE_ID }}/dns_records/$RECORD_ID" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data "{
              \"type\":\"A\",
              \"name\":\"$DOMAIN\",
              \"content\":\"$TARGET_IP\",
              \"ttl\":120,
              \"proxied\":true
            }"
